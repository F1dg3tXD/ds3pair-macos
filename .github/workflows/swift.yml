# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run tests (release)
      run: swift test -c release

    - name: Build universal binary
      run: swift build -c release --arch arm64 --arch x86_64

    - name: Create distributable archive
      run: |
        REF_NAME="${GITHUB_REF_NAME//\//-}"
        mkdir -p dist
        cp .build/apple/Products/Release/ds3pair-macos dist/
        cd dist
        shasum -a 256 ds3pair-macos > ds3pair-macos.sha256
        zip -r ../ds3pair-macos-${REF_NAME}.zip ds3pair-macos ds3pair-macos.sha256
        cd ..
        shasum -a 256 ds3pair-macos-${REF_NAME}.zip

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ds3pair-macos-${{ github.ref_name }}
        path: ds3pair-macos-*.zip
        if-no-files-found: error
